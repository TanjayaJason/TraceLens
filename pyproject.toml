[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tracelens-portfolio"
version = "0.1.0"
description = "Find the incident inside the noise."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12,<1",
  "pydantic>=2.8,<3",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
ai = ["langchain-openai>=1,<2"]

[project.scripts]
tracelens = "tracelens.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
